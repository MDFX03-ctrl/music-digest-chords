[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdchord"
version = "0.2.0"
description = "Local chord toolbox for a music producer. Measures audio on this machine. No API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "librosa>=0.10",
  "pedalboard>=0.9",
  "mido>=1.3",
]

# No console script on purpose: the package finds tools/, viewer/ and
# instruments/ beside itself, so it runs from this folder as "python -m mdchord".

[tool.setuptools.packages.find]
include = ["mdchord*"]
